name: Build iSCSI Console

on:
  push:
    branches:
      - master
      - 'codex/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows package
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install ILMerge
        run: nuget install ILMerge -Version 3.0.41 -OutputDirectory tools

      - name: Restore
        run: msbuild ISCSIConsole/ISCSIConsole.csproj /t:Restore /p:Configuration=Release /p:TargetFramework=net472 /p:SkipILRepack=true

      - name: Build
        run: >
          msbuild ISCSIConsole/ISCSIConsole.csproj
          /p:Configuration=Release
          /p:TargetFramework=net472
          /p:SkipILMerge=true
          /p:SkipILRepack=true

      - name: Restore tests
        run: msbuild ISCSIConsole.Tests/ISCSIConsole.Tests.csproj /t:Restore /p:Configuration=Release

      - name: Build and run tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $testLog = "artifacts/test-output.log"
          msbuild ISCSIConsole.Tests/ISCSIConsole.Tests.csproj /p:Configuration=Release /p:SkipILMerge=true /p:SkipILRepack=true
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            "TEST_BUILD_EXIT=$buildExit" | Set-Content -LiteralPath $testLog
            exit $buildExit
          }
          & ISCSIConsole.Tests/bin/Release/net472/ISCSIConsole.Tests.exe 2>&1 | Tee-Object -FilePath $testLog
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) { exit $testExit }

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iSCSIConsole-test-log-${{ github.run_id }}
          path: artifacts/test-output.log
          if-no-files-found: warn

      - name: Setup .NET for self-contained headless build
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained headless executable
        shell: pwsh
        run: |
          dotnet publish ISCSIConsole.Headless/ISCSIConsole.Headless.csproj -c Release -r win-x64 --self-contained true -p:SkipILRepack=true -o artifacts/iSCSIConsole-headless-win-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test headless runtime and published executable
        shell: pwsh
        run: |
          dotnet build ISCSIConsole.Tests/ISCSIConsole.Tests.csproj -c Release -p:HeadlessTests=true -p:SkipILRepack=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ISCSI_CONSOLE_EXE = (Resolve-Path artifacts/iSCSIConsole-headless-win-x64/ISCSIConsole.exe).Path
          dotnet ISCSIConsole.Tests/bin/Release/net10.0/ISCSIConsole.Tests.dll 2>&1 | Tee-Object -FilePath artifacts/headless-test-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload headless test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iSCSIConsole-headless-test-log-${{ github.run_id }}
          path: artifacts/headless-test-output.log
          if-no-files-found: warn

      - name: Merge single executable
        shell: pwsh
        run: |
          & ISCSIConsole/ILMerge/ILMerge.bat net472
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "ILMerge failed. The package will fall back to the normal exe/dll layout."
            exit 0
          }

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/iSCSIConsole-net472 -Force | Out-Null
          $mergedExe = "ISCSIConsole/bin/ILMerge/net472/ISCSIConsole.exe"
          if (Test-Path $mergedExe) {
            Copy-Item -LiteralPath $mergedExe -Destination artifacts/iSCSIConsole-net472/
          } else {
            Copy-Item -Path ISCSIConsole/bin/Release/net472/*.exe -Destination artifacts/iSCSIConsole-net472/
            Copy-Item -Path ISCSIConsole/bin/Release/net472/*.dll -Destination artifacts/iSCSIConsole-net472/
            Copy-Item -Path ISCSIConsole/bin/Release/net472/*.config -Destination artifacts/iSCSIConsole-net472/ -ErrorAction SilentlyContinue
          }

      - name: Copy license and readme
        shell: pwsh
        run: |
          Copy-Item -LiteralPath License.txt -Destination artifacts/iSCSIConsole-net472/
          Copy-Item -LiteralPath Readme.md -Destination artifacts/iSCSIConsole-net472/
          Copy-Item -LiteralPath License.txt -Destination artifacts/iSCSIConsole-headless-win-x64/
          Copy-Item -LiteralPath Readme.md -Destination artifacts/iSCSIConsole-headless-win-x64/

      - name: Create archive
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/iSCSIConsole-net472/* -DestinationPath artifacts/iSCSIConsole-net472.zip -Force
          Compress-Archive -Path artifacts/iSCSIConsole-headless-win-x64/* -DestinationPath artifacts/iSCSIConsole-headless-win-x64.zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: iSCSIConsole-net472
          path: artifacts/iSCSIConsole-net472.zip
          if-no-files-found: error

      - name: Upload self-contained headless package
        uses: actions/upload-artifact@v4
        with:
          name: iSCSIConsole-headless-win-x64
          path: artifacts/iSCSIConsole-headless-win-x64.zip
          if-no-files-found: error

      - name: Update latest tag
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: |
          git tag -f latest $env:GITHUB_SHA
          git push origin refs/tags/latest --force

      - name: Publish public latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest iSCSI Console build
          body: |
            Build 1.5.9 from commit ${{ github.sha }}.

            - net472: existing Windows GUI and command-line version; requires .NET Framework 4.7.2.
            - headless-win-x64: command-line version with its own .NET 10 runtime, no .NET installation or WinForms required. This is self-contained, not NativeAOT. Windows 10/11 and corresponding Server systems; minimal WinPE compatibility depends on the PE components and requires testing.

            Fixes image-open handle leaks and incomplete reads; reduces read-cache node allocation and per-packet logging overhead, including normal /log operation. Set ISCSICONSOLE_DEBUG=1 only when detailed diagnosis is needed. Existing BSCX command-line options are preserved. No write-back cache or promised throughput multiplier.
          files: |
            artifacts/iSCSIConsole-net472.zip
            artifacts/iSCSIConsole-headless-win-x64.zip
          overwrite_files: true
          make_latest: true
